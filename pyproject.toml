[project]
name = "jobs-orchestrator"
version = "0.1.0"
description = "Continuo — deterministic notation for probabilistic work"
readme = "README.md"
authors = [
    { name = "Michael Buuckingham", email = "michael.buckingham74@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
jobs-orchestrator = "jobs_orchestrator:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
